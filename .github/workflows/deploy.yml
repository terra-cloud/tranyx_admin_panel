name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Run Tests
        run: dart test/promotion_calculator_test.dart
      
      - name: Activate Jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Clean
        run: dart pub global run jaspr_cli:jaspr clean

      - name: Build Web App
        run: dart run build_runner build -d -o web:build/jaspr --delete-conflicting-outputs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANYX_ADMIN_PORTAL }}
          channelId: live
          projectId: tranyx-admin-portal
