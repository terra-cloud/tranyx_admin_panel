name: PR Preview Deploy

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    name: Test and Build Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Install Tailwind CSS CLI
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Compile Tailwind CSS
        run: |
          tailwindcss -i web/styles.tw.css -o web/styles.css --minify
          cp web/styles.css web/main.css

      - name: Install Jaspr CLI
        run: |
          flutter pub global activate jaspr_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Inject Environment Secrets
        run: |
          if [ -n "${{ secrets.IMGBB_API_KEY }}" ]; then
            echo "IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}" >> .env
          fi
          if [ -n "${{ secrets.MAIL_TRAP_TOKEN }}" ]; then
            echo "MAIL_TRAP_TOKEN=${{ secrets.MAIL_TRAP_TOKEN }}" >> .env
          elif [ -n "${{ secrets.MAILTRAP_TOKEN }}" ]; then
            echo "MAIL_TRAP_TOKEN=${{ secrets.MAILTRAP_TOKEN }}" >> .env
          fi
          if [ -n "${{ secrets.MAIL_TRAP_PROXY_URL }}" ]; then
            echo "MAIL_TRAP_PROXY_URL=${{ secrets.MAIL_TRAP_PROXY_URL }}" >> .env
          fi
          if [ -n "${{ secrets.MAIL_TRAP_INBOX_ID }}" ]; then
            echo "MAIL_TRAP_INBOX_ID=${{ secrets.MAIL_TRAP_INBOX_ID }}" >> .env
          fi

      - name: Build Web App
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          MAIL_TRAP_TOKEN: ${{ secrets.MAIL_TRAP_TOKEN || secrets.MAILTRAP_TOKEN }}
          MAIL_TRAP_PROXY_URL: ${{ secrets.MAIL_TRAP_PROXY_URL }}
          MAIL_TRAP_INBOX_ID: ${{ secrets.MAIL_TRAP_INBOX_ID }}
        run: |
          jaspr clean
          jaspr build \
            --dart-define=IMGBB_API_KEY="${{ secrets.IMGBB_API_KEY || 'abfd185244dc224ff987946bc9775bfc' }}" \
            --dart-define=MAIL_TRAP_TOKEN="${{ secrets.MAIL_TRAP_TOKEN || secrets.MAILTRAP_TOKEN }}" \
            --dart-define=MAIL_TRAP_PROXY_URL="${{ secrets.MAIL_TRAP_PROXY_URL }}" \
            --dart-define=MAIL_TRAP_INBOX_ID="${{ secrets.MAIL_TRAP_INBOX_ID || '4886849' }}"

      - name: Deploy to Firebase Hosting Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tranyx-admin-portal
