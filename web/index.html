<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">
        <title>Tranyx Admin Portal</title>
        <link rel="icon" type="image/png" href="images/logo.png">
        <link rel="apple-touch-icon" href="images/logo.png">

        <!-- Google Fonts: Plus Jakarta Sans -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

        <!-- Loads the generated CSS files -->
        <link rel="stylesheet" href="main.css">
        <link rel="stylesheet" href="styles.css">

        <!-- Inline critical loading styles so something is visible before JS -->
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { 
                background: #f9fafb; 
                color: #09090b; 
                font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            }
            #app-loading {
                position: fixed; inset: 0; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 16px;
                background: #f9fafb; z-index: 9999;
            }
            #app-loading .spinner {
                width: 36px; height: 36px; border-radius: 50%;
                border: 3px solid rgba(0,0,0,0.05);
                border-top-color: #000000;
                animation: spin 0.8s linear infinite;
            }
            #app-loading p { font-size: 11px; color: #a1a1aa; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
            @keyframes spin { to { transform: rotate(360deg); } }

            /* Page Fade & Slide Transition */
            .page-transition {
                animation: pageFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            @keyframes pageFadeIn {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>

        <!-- Loads and runs the compiled 'main.client.dart' file -->
        <script defer src="main.client.dart.js"></script>
    </head>
    <body>
        <!-- Visible loading state before JavaScript boots -->
        <div id="app-loading">
            <img src="images/logo.png" alt="Tranyx Logo" style="width: 48px; height: 48px; object-fit: contain; animation: pulse 1.5s ease-in-out infinite;">
            <div class="spinner"></div>
            <p>Loading Tranyx Portal…</p>
        </div>
    </body>
</html>
